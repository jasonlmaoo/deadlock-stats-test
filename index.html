<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DL.GG</title>

  <style>
    #topHeroes {
  background: rgba(0, 0, 0, 0.6);
  padding: 12px;
  border-radius: 12px;
}
#topHeroes h2 { font-size: 16px; margin-top: 0; }
#rankSelect {
  font-family: inherit;
  font-size: 15px;
  padding: 8px 16px;
  border-radius: 999px;
  border: none;
  margin-bottom: 8px;
}
#topHeroesList { max-height: 600px; overflow-y: auto; }
#topHeroes table { font-size: 12px; margin-top: 8px; }
#topHeroes th, #topHeroes td { padding: 4px 6px; }
#topHeroes td:nth-child(2) { text-align: left; }
#topHeroes dl-hero-minimap-icon {
  width: 22px;
  height: 22px;
  display: inline-block;
  vertical-align: middle;
}
    .profile-header {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin: 20px auto;
  padding: 12px 24px;
  max-width: 500px;
  background: rgba(0, 0, 0, 0.65);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  font-size: 24px;
}
.profile-header img {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  margin: 0;
  display: block;
}
    #playerInput {
  width: 420px;
  max-width: 90%;
  padding: 14px 20px;
  font-size: 20px;
  border-radius: 999px;
}

#lookupButton {
  padding: 14px 30px;
  font-size: 20px;
  border-radius: 999px;
}
  body {
    text-align: center;
    font-family: "Cinzel", Georgia, serif;
    text-shadow: 0 0 4px #000000, 0 0 8px #000000;
    background-color: #1a1a1f;
    background-image: url("deadlock city.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    color: #eeeeee;
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
    h1 {
      font-weight: 700;
      letter-spacing: 3px;
  }
}
    }
    input, button {
      font-family: inherit;
      font-size: 16px;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
    }
    input  { width: 260px; }
    button { background: #e0a030; cursor: pointer; }
    table  { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #444; padding: 8px; text-align: center; }
    th     { background: #2a2a33; }
    #status { margin-top: 15px; color: #e0a030; }
    #raw    { background: #101014; padding: 10px; margin-top: 20px;
              max-height: 250px; overflow: auto; font-size: 12px; }
    .tabs { margin: 20px 0; }

.tab {
  background: rgba(0, 0, 0, 0.6);
  color: #eeeeee;
  margin: 0 5px;
  padding: 12px 28px;
  font-size: 18px;
  border: 2px solid rgba(255, 255, 255, 0.25);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.15s ease, border-color 0.2s ease;
}

.tab:hover {
  background: rgba(224, 160, 48, 0.35);
  border-color: #e0a030;
  transform: translateY(-2px);
}

.tab.active {
  background: #e0a030;
  color: #000000;
  border-color: #e0a030;
  font-weight: bold;
}
    /* Two columns: small hero stats on the left, match history in the middle. */
.layout {
  display: grid;
  grid-template-columns: 340px 1fr 340px;
  gap: 20px;
  align-items: start;
}

/* Make the hero stats smaller. */
#results table { font-size: 12px; }
#results th, #results td { padding: 4px 6px; }
#results td:first-child { text-align: left; }
#results h2 { font-size: 16px; }
#results dl-hero-minimap-icon {
  width: 22px;
  height: 22px;
  display: inline-block;
  vertical-align: middle;
}

/* Green for wins, red for losses. */
tr.win td  { background: rgba(46, 160, 67, 0.35); }
tr.loss td { background: rgba(200, 50, 50, 0.35); }
tr.win td:nth-child(2)  { color: #6dff8a; font-weight: bold; }
tr.loss td:nth-child(2) { color: #ff7a7a; font-weight: bold; }

/* On phones, stack everything in one column. */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; }
}
#profileList { max-width: 420px; margin: 8px auto 0; text-align: left;
               max-height: 360px; overflow-y: auto; }
  .profile {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: rgba(0, 0, 0, 0.75);
  border: 1px solid #444;
  cursor: pointer;
}
.profile:hover { background: rgba(224, 160, 48, 0.35); }
.profile img { width: 36px; height: 36px; border-radius: 4px; display: block; margin: 0; }
  </style>
</head>
<body>

  <h1>DL.GG</h1>
  <img src="deadlock logo transparent.png" alt="Deadlock Logo" width="700">
  <p>Enter Steam Username or ID.</p>

  <input id="playerInput" placeholder="Steam ID">
  <button id="lookupButton">Look up</button>
  <div id="profileList"></div>
  

  <div class="tabs">
  <button class="tab active" data-tab="all">All</button>
  <button class="tab" data-tab="ranked">Ranked</button>
  <button class="tab" data-tab="brawl">Street Brawl</button>
  </div>
  <p id="status"></p>
  <div id="profileHeader"></div>
  <div class="layout">
  <div id="results"></div>
  <div id="recent"></div>
    <div id="topHeroes">
  <h2>Top win rates</h2>
  <select id="rankSelect">
    <option value="all">All ranks</option>
    <option value="1">Initiate</option>
    <option value="2">Seeker</option>
    <option value="3">Alchemist</option>
    <option value="4">Arcanist</option>
    <option value="5">Ritualist</option>
    <option value="6">Emissary</option>
    <option value="7">Archon</option>
    <option value="8">Oracle</option>
    <option value="9">Phantom</option>
    <option value="10">Ascendant</option>
    <option value="11">Eternus</option>
  </select>
  <div id="topHeroesList"></div>
</div>
</div>

  <details>
    <summary>Show raw data (helps with debugging)</summary>
    <pre id="raw"></pre>
  </details>
  <script type="module" src="https://unpkg.com/@deadlock-api/ui-core/dist/main/main.esm.js"></script>
  <script>
    // ============================================================
    // PART 1: SETTINGS
    // Everything that might need fixing is up here in one place.
    // Check the API docs on deadlock-api.com to confirm these.
    // ============================================================
    const API_BASE    = "https://api.deadlock-api.com";
    const ASSETS_BASE = "https://assets.deadlock-api.com";

  const TAB_FILTERS = {
    all:    "",
    ranked: "&match_mode=ranked",
    brawl:  "&game_mode=street_brawl"
  };
  let currentTab = "all";

  function heroStatsUrl(accountId) {
    return API_BASE + "/v1/players/hero-stats?account_ids=" + accountId + TAB_FILTERS[currentTab];
}
  function matchHistoryUrl(accountId) {
  return API_BASE + "/v1/players/" + accountId + "/match-history?only_stored_history=true";
}
    // Address for the list of heroes (so we can show names, not numbers).
    const HEROES_URL = "https://api.deadlock-api.com/v1/assets/heroes";

  // Win rates for every hero. "rank" is a number 1 to 11, or "all".
function topHeroesUrl(rank) {
  const since = Math.floor(Date.now() / 1000) - 30 * 24 * 60 * 60;
  let url = API_BASE + "/v1/analytics/hero-stats?min_unix_timestamp=" + since;

  if (rank !== "all") {
    const low = Number(rank) * 10 + 1;
    url += "&min_average_badge=" + low + "&max_average_badge=" + (low + 5);
  }
  return url;
}

    // ============================================================
    // PART 2: GRAB THE PIECES OF THE PAGE
    // ============================================================
    const playerInput  = document.getElementById("playerInput");
    const lookupButton = document.getElementById("lookupButton");
    const statusText   = document.getElementById("status");
    const resultsBox   = document.getElementById("results");
    const rawBox       = document.getElementById("raw");
    const recentBox = document.getElementById("recent");
    const profileList = document.getElementById("profileList");
    const profileHeader = document.getElementById("profileHeader");
    const rankSelect     = document.getElementById("rankSelect");
    const topHeroesList  = document.getElementById("topHeroesList");


    // ============================================================
    // PART 3: HELPER FUNCTIONS
    // ============================================================

    // Steam has two kinds of IDs for the same person:
    //   - Steam64: a huge 17-digit number (starts with 7656...)
    //   - Account ID: the short one
    // The Deadlock API wants the short one, so we convert if needed.
    function toAccountId(text) {
      const cleaned = text.trim();
      if (cleaned.length >= 16) {
        // BigInt is used because the number is too big for normal math.
        const steam64 = BigInt(cleaned);
        return (steam64 - 76561197960265728n).toString();
      }
      return cleaned;
    }

    // Some APIs name the same thing differently ("wins" vs "win_count").
    // This tries each name in a list and returns the first one it finds.
    function pick(obj, names, fallback = 0) {
      for (const name of names) {
        if (obj[name] !== undefined) return obj[name];
      }
      return fallback;
    }

    // Turns a number like 0.5234 into "52.3%".
    function percent(part, total) {
      if (!total) return "0%";
      return ((part / total) * 100).toFixed(1) + "%";
    }


    // ============================================================
    // PART 4: GET THE HERO NAMES
    // Returns a lookup like { 1: "Infernus", 2: "Seven", ... }
    // If this fails, we just show hero ID numbers instead.
    // ============================================================
async function getHeroNames() {
  const info = {};
  try {
    const response = await fetch(HEROES_URL);
    const data = await response.json();

    // Show what came back, so we can look at it.
    console.log("Hero list from API:", data);

    // The list might be direct, or inside an object.
    const heroes = Array.isArray(data) ? data : (data.heroes || []);

    for (const hero of heroes) {
      const id     = pick(hero, ["id", "hero_id"], null);
      const name   = pick(hero, ["name", "display_name", "class_name"], null);
      const images = hero.images || {};
      const image  = pick(images, ["icon_hero_card"], "");

      if (id !== null) info[id] = { name: name, image: image };
    }
  } catch (error) {
    console.log("Could not load hero names:", error);
  }
  return info;
}


    // ============================================================
    // PART 5: SHOW THE TABLE
    // ============================================================
    function showTable(heroStats, heroNames) {
      let rows = "";

      // Running totals for the lifetime summary.
      let totalMatches = 0;
      let totalWins    = 0;
      // Put the most played hero first.
const sortedStats = heroStats.slice().sort(function (a, b) {
  return Number(pick(b, ["matches_played", "matches"])) - Number(pick(a, ["matches_played", "matches"]));
});
      for (const hero of sortedStats) {
        const heroId  = pick(hero, ["hero_id", "heroId", "id"], "?");
        const matches = Number(pick(hero, ["matches_played", "matches"]));
        const wins    = Number(pick(hero, ["wins"]));
        const kills   = pick(hero, ["kills"]);
        const deaths  = pick(hero, ["deaths"]);
        const assists = pick(hero, ["assists"]);

        // Add this hero's numbers to the totals.
        totalMatches += matches;
        totalWins    += wins;

        const info    = heroNames[heroId] || {};
        const name    = info.name || "Hero #" + heroId;
        const picture = '<dl-hero-minimap-icon hero-id="' + heroId + '"></dl-hero-minimap-icon> ';

        rows += "<tr>" +
          "<td>" + picture + name + "</td>" +
          "<td>" + matches + "</td>" +
          "<td>" + percent(wins, matches) + "</td>" +
          "<td>" + kills + " / " + deaths + " / " + assists + "</td>" +
          "</tr>";
      }

      // The summary shown above the table.
      const summary =
        "<h2>Total Games: " + totalMatches + " games</h2>" +
        "<p>Wins: " + totalWins +
        " &nbsp;|&nbsp; Win rate: " + percent(totalWins, totalMatches) + "</p>";

      resultsBox.innerHTML =
        summary +
        "<table>" +
        "<tr><th>Hero</th><th>Matches</th><th>Win rate</th><th>K / D / A</th></tr>" +
        rows +
        "</table>";
    }
    function showRecentMatches(matches, heroNames) {
  // Sort so the newest match comes first, then keep the top 10.
  const sorted = matches.slice().sort(function (a, b) {
    return Number(pick(b, ["start_time"], 0)) - Number(pick(a, ["start_time"], 0));
  });
  const recent = sorted.slice(0, 10);

  let rows = "";

  for (const match of recent) {
    const heroId  = pick(match, ["hero_id"], "?");
    const info    = heroNames[heroId] || {};
    const name    = info.name || "Hero #" + heroId;
    const picture = '<dl-hero-minimap-icon hero-id="' + heroId + '"></dl-hero-minimap-icon> ';

    const kills   = pick(match, ["player_kills", "kills"]);
    const deaths  = pick(match, ["player_deaths", "deaths"]);
    const assists = pick(match, ["player_assists", "assists"]);

    // A win means the player's team is the team that won.
    const team   = pick(match, ["player_team"], null);
    const winner = pick(match, ["match_result"], null);
    let result = "?";
    if (team !== null && winner !== null) {
      result = (String(team) === String(winner)) ? "Win" : "Loss";
    }
    let rowClass = "";
    if (result === "Win")  rowClass = "win";
    if (result === "Loss") rowClass = "loss";

    const started = Number(pick(match, ["start_time"], 0));
    const date    = started ? new Date(started * 1000).toLocaleDateString() : "?";
    const minutes = Math.round(Number(pick(match, ["match_duration_s"], 0)) / 60);

    rows += '<tr class="' + rowClass + '">' +
      "<td>" + picture + name + "</td>" +
      "<td>" + result + "</td>" +
      "<td>" + kills + " / " + deaths + " / " + assists + "</td>" +
      "<td>" + minutes + " min</td>" +
      "<td>" + date + "</td>" +
      "</tr>";
  }

  recentBox.innerHTML =
    "<h2>Recent matches</h2>" +
    "<table>" +
    "<tr><th>Hero</th><th>Result</th><th>K / D / A</th><th>Length</th><th>Date</th></tr>" +
    rows +
    "</table>";
}
    let headerFor = null;

async function showProfileHeader(accountId) {
  headerFor = accountId;
  try {
    const response = await fetch(API_BASE + "/v1/players/steam?account_ids=" + accountId);
    if (!response.ok) return;

    const profiles = await response.json();
    console.log("Profile sample:", profiles[0]);
    const person = profiles[0];

    // Skip if the person already started a different lookup.
    if (!person || headerFor !== accountId) return;

    const name   = pick(person, ["personaname", "name"], "Unknown player");
    const avatar = pick(person, ["avatarfull", "avatarmedium", "avatar"], "");

    profileHeader.innerHTML = "";
    const box = document.createElement("div");
    box.className = "profile-header";

    if (String(avatar).startsWith("https://")) {
      const pic = document.createElement("img");
      pic.src = avatar;
      pic.alt = "";
      box.appendChild(pic);
    }

    const label = document.createElement("span");
    label.textContent = name;
    box.appendChild(label);

    profileHeader.appendChild(box);
  } catch (error) {
    console.log("Could not load profile:", error);
  }
}
    // ============================================================
    // PART 6: THE MAIN LOOKUP (runs when the button is clicked)
    // ============================================================
    async function lookupPlayer() {
      const text = playerInput.value;

      if (!text.trim()) {
        statusText.textContent = "Please type a Steam ID first.";
        return;
      }

      statusText.textContent = "Loading...";
      resultsBox.innerHTML = "";
      profileHeader.innerHTML = "";
      rawBox.textContent = "";
      recentBox.innerHTML = "";
      try {
        let accountId = chosenAccountId;

if (!accountId) {
  if (/^[0-9]+$/.test(text.trim())) {
    accountId = toAccountId(text);
  } else {
    await searchProfiles(text);
    statusText.textContent = "Pick your profile from the list.";
    return;
  }
}
  showProfileHeader(accountId);
        // Ask for hero stats and hero names at the same time.
        const [response, heroNames] = await Promise.all([
          fetch(heroStatsUrl(accountId)),
          getHeroNames()
        ]);

        if (!response.ok) {
          statusText.textContent = "The API said no (code " + response.status + ").";
          return;
        }

        const data = await response.json();
        rawBox.textContent = JSON.stringify(data, null, 2);

        // The API might return a list directly, or wrap it in an object.
        const heroStats = Array.isArray(data) ? data : (data.heroes || []);

        if (heroStats.length === 0) {
          statusText.textContent = "No stats found for that player.";
          return;
        }

        showTable(heroStats, heroNames);
  try {
    const matchResponse = await fetch(matchHistoryUrl(accountId));
    if (matchResponse.ok) {
      const matches = await matchResponse.json();
      console.log("Match history sample:", matches[0]);
      showRecentMatches(matches, heroNames);
  }
} catch (error) {
  console.log("Could not load recent matches:", error);
}
        statusText.textContent = "Found Ya!";

      } catch (error) {
        console.log(error);
        statusText.textContent = "Something went wrong. Check the ID and try again.";
      }
    }

    lookupButton.addEventListener("click", lookupPlayer);

    // Let the Enter key work too.
    playerInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") lookupPlayer();
    });
  // Clicking a tab switches the filter and looks the player up again.
const tabButtons = document.querySelectorAll(".tab");
for (const tabButton of tabButtons) {
  tabButton.addEventListener("click", function () {
    currentTab = tabButton.dataset.tab;
    for (const other of tabButtons) other.classList.remove("active");
    tabButton.classList.add("active");
    if (playerInput.value.trim()) lookupPlayer();
  });
}
    // ---- Profile search ----
let chosenAccountId = null;
let searchTimer = null;

function profileSearchUrl(name) {
  return API_BASE + "/v1/players/steam-search?search_query=" + encodeURIComponent(name);
}

async function searchProfiles(name) {
  const query = name.trim();
  profileList.innerHTML = "";
  if (query.length < 2) return;

  try {
    const response = await fetch(profileSearchUrl(query));
    if (!response.ok) {
      profileList.textContent = "No profiles found.";
      return;
    }
    const people = await response.json();
    console.log("Profile search sample:", people[0]);

  for (const person of people) {
    const accountId = pick(person, ["account_id"], null);
      const name   = pick(person, ["personaname", "name"], "Unknown");
      const avatar = pick(person, ["avatar", "avatarmedium", "avatarfull"], "");
      if (accountId === null) continue;

      const row = document.createElement("div");
      row.className = "profile";

      if (String(avatar).startsWith("https://")) {
        const pic = document.createElement("img");
        pic.src = avatar;
        pic.alt = "";
        row.appendChild(pic);
      }

      const label = document.createElement("span");
      label.textContent = name + " (ID " + accountId + ")";
      row.appendChild(label);

      row.addEventListener("click", function () {
        chosenAccountId = String(accountId);
        playerInput.value = name;
        profileList.innerHTML = "";
        lookupPlayer();
      });

      profileList.appendChild(row);
    }
  } catch (error) {
    console.log("Profile search failed:", error);
  }
}

// Search a moment after the person stops typing.
playerInput.addEventListener("input", function () {
  chosenAccountId = null;
  clearTimeout(searchTimer);
  const text = playerInput.value.trim();

  if (/^[0-9]+$/.test(text) || text.length < 2) {
    profileList.innerHTML = "";
    return;
  }
  searchTimer = setTimeout(function () { searchProfiles(text); }, 400);
});
  // ---- Top win rates panel ----
let topHeroesRequest = 0;

async function loadTopHeroes() {
  // Heroes with fewer games than this are skipped, because tiny samples are misleading.
  const MIN_MATCHES = 30;

  const thisRequest = ++topHeroesRequest;
  topHeroesList.textContent = "Loading...";

  try {
    const [response, heroNames] = await Promise.all([
      fetch(topHeroesUrl(rankSelect.value)),
      getHeroNames()
    ]);

    if (!response.ok) {
      topHeroesList.textContent = "Could not load win rates.";
      return;
    }

    const data = await response.json();
    console.log("Top heroes sample:", data[0]);

    // If the person picked another rank while this was loading, drop this result.
    if (thisRequest !== topHeroesRequest) return;

    const heroes = Array.isArray(data) ? data : [];

    const ranked = heroes
      .map(function (hero) {
        return {
          id:      pick(hero, ["hero_id"], "?"),
          matches: Number(pick(hero, ["matches"])),
          wins:    Number(pick(hero, ["wins"]))
        };
      })
      .filter(function (hero) { return hero.matches >= MIN_MATCHES; })
      .sort(function (a, b) { return (b.wins / b.matches) - (a.wins / a.matches); });

    if (ranked.length === 0) {
      topHeroesList.textContent = "Not enough games for this rank yet.";
      return;
    }

    let rows = "";
    let place = 1;

    for (const hero of ranked) {
      const info = heroNames[hero.id] || {};
      const name = info.name || "Hero #" + hero.id;
      const picture = '<dl-hero-minimap-icon hero-id="' + hero.id + '"></dl-hero-minimap-icon> ';

      rows += "<tr>" +
        "<td>" + place + "</td>" +
        "<td>" + picture + name + "</td>" +
        "<td>" + percent(hero.wins, hero.matches) + "</td>" +
        "<td>" + hero.matches + "</td>" +
        "</tr>";
      place++;
    }

    topHeroesList.innerHTML =
      "<table>" +
      "<tr><th>#</th><th>Hero</th><th>Win rate</th><th>Games</th></tr>" +
      rows +
      "</table>";

  } catch (error) {
    console.log("Could not load top heroes:", error);
    topHeroesList.textContent = "Could not load win rates.";
  }
}

// Reload when a different rank is picked, and once when the page opens.
rankSelect.addEventListener("change", loadTopHeroes);
loadTopHeroes();
  </script>

</body>
</html>
